<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모해 위생 기록</title>
<link rel="stylesheet" href="fonts/fonts.css">
<script src="lib/html2canvas.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<style>
/* Layout: sticky top bar (date + who) → two views: "오늘 체크" big tap rows, "월별 기록표" paper-form replica */
:root{
  --bg:#F6EEE3; --surface:#FFFBF5; --fg:#26301F; --muted:#6E7564; --line:#E2D6C4;
  --accent:#3D4B34; --accent-fg:#FAF0E6; --gold:#C5A253; --gold-ink:#8E7228; --chip:#EFE5D5;
  --ok:#3E7B4A; --ok-bg:#E3F0E2; --warn:#A3412E; --warn-bg:#F7E1DA; --week:#E9E1F0;
  --paper:#FFFFFF; --paper-ink:#1E1E1E; --paper-line:#BDBDBD;
  --display:"Black Han Sans","Gothic A1",system-ui,sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --form:"Quicksand","Gothic A1",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B2117; --surface:#242C1F; --fg:#F3E9DA; --muted:#A9AE9C; --line:#3A4532;
  --accent:#C5A253; --accent-fg:#1B2117; --gold-ink:#D9BB6E; --chip:#2E3828;
  --ok:#8FCB97; --ok-bg:#24392A; --warn:#E89A86; --warn-bg:#40261F; --week:#2F2B38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B2117; --surface:#242C1F; --fg:#F3E9DA; --muted:#A9AE9C; --line:#3A4532;
  --accent:#C5A253; --accent-fg:#1B2117; --gold-ink:#D9BB6E; --chip:#2E3828;
  --ok:#8FCB97; --ok-bg:#24392A; --warn:#E89A86; --warn-bg:#40261F; --week:#2F2B38; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto}
button{font-family:var(--body)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-fg);padding-block:12px}
.top .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{font-family:var(--display);font-size:24px;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.14em;opacity:.8;margin-bottom:3px}
.datenav{display:flex;align-items:center;gap:6px}
.datenav button{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:transparent;color:inherit;font-size:18px;cursor:pointer}
.datenav .d{min-width:150px;text-align:center;font-weight:800;font-size:17px}
.datenav .today{width:auto;padding:0 12px;font-size:13px;font-weight:700}
.who{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.who span{font-size:12px;font-weight:700;opacity:.85}
.who button{min-width:44px;height:40px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:inherit;font-weight:800;font-size:15px;cursor:pointer}
.who button[aria-pressed="true"]{background:var(--gold);color:#1B2117;border-color:var(--gold)}
.who .edit{font-size:12px;font-weight:700;min-width:0}

.tabs{display:flex;gap:6px;padding-block:14px 4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:800;font-size:14px;padding:10px 18px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.banner{background:var(--chip);border-radius:12px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:10px 0}
.banner button{border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:700;font-size:12px;padding:7px 12px;border-radius:8px;cursor:pointer}

/* today view */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0 18px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--fg)}
.sum b{display:block;font-size:13px}
.sum .n{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.sum .bar{height:5px;border-radius:3px;background:var(--chip);margin-top:6px;overflow:hidden}
.sum .bar i{display:block;height:100%;background:var(--ok)}
.sum.done{border-color:var(--ok)}

.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;scroll-margin-top:110px}
.bh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bh h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.bh h2 small{font-family:var(--form);font-size:13px;font-weight:700;color:var(--muted);margin-left:8px;letter-spacing:.04em}
.bh>div{flex-wrap:wrap;justify-content:flex-end}
.bh .all{border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer}
.bh .cnt{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

.temps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.tcard .tt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.tcard .tt b{font-size:15px}
.tcard .tt span{font-size:12px;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}
.chips button{min-width:0;letter-spacing:-.02em;height:48px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:800;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.chips button.hot{color:var(--warn)}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chips button.hot[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.tstate{margin-top:8px;font-size:13px;min-height:20px}
.tstate .ok{color:var(--ok);font-weight:700}
.tstate .bad{color:var(--warn);font-weight:700}

.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:10px 12px;min-height:62px;cursor:pointer}
.row .box{width:36px;height:36px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface)}
.row .nm{min-width:0}
.row .nm b{display:block;font-size:15px;overflow-wrap:anywhere}
.row .nm span{font-size:12px;color:var(--muted)}
.freq{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.freq.S{background:var(--warn-bg);color:var(--warn)}
.freq.W{background:var(--week);color:var(--fg)}
.row.on{border-color:var(--ok);background:var(--ok-bg)}
.row.on .box{background:var(--ok);border-color:var(--ok);color:#fff}
.row.wk{border-style:dashed}
.row.wk .nm span.wkdone{color:var(--ok);font-weight:700}
.rem{margin-top:10px}
.rem summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.rem textarea{width:100%;min-height:60px;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:500 14px var(--body);padding:8px 10px;resize:vertical}

.acts{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.acts p{margin:0 0 6px;font-size:13px;font-weight:800;color:var(--warn)}
.acts.ok p{color:var(--ok)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:700;font-size:13px;padding:9px 12px;border-radius:999px;cursor:pointer}
.pills button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.acts input,.form input[type=text],.form textarea{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg);font:500 14px var(--body);padding:9px 10px}
.form{display:grid;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.form .lbl{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:22px;font-weight:800;cursor:pointer}
.stepper output{min-width:90px;text-align:center;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.stepper output.hot{color:var(--warn)}
.stepper .skip{width:auto;padding:0 12px;font-size:13px}
.form .save{border:0;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:16px;padding:14px;border-radius:12px;cursor:pointer}
.form .err{color:var(--warn);font-size:13px;font-weight:700;margin:0}
.log{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.log .li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font-size:14px}
.log .li .tm{font-weight:800;font-variant-numeric:tabular-nums}
.log .li .tx{min-width:0;overflow-wrap:anywhere}
.log .li .tx small{display:block;color:var(--muted);font-size:12px}
.log .li .res{font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.log .li .res.bad{background:var(--warn-bg);color:var(--warn)}
.log .li .del{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:5px 8px;font-size:12px;font-weight:700;cursor:pointer;margin-left:6px}
.log .li .del.sure{background:var(--warn);color:#fff;border-color:var(--warn)}
.oilbig{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.oilbig .save{border:0;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:16px;padding:14px 20px;border-radius:12px;cursor:pointer}
.oilbig .since{font-size:14px}
.oilbig .since b{font-family:var(--display);font-weight:400;font-size:24px}
.paper .list{width:100%;border-collapse:collapse;font-size:10.5px;margin-top:8px;flex:0 0 auto}
.paper .list th{background:#F3F3EE}
.paper .list td{height:22px;padding:0 4px}
.paper .list td.l{text-align:left}
.paper .sub{margin:10px 0 0;font-size:12px;font-weight:700}
.paper .empty{color:#888;font-size:11px;padding:8px 0}
/* month view */
.mbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:12px 0}
.sheets{display:flex;gap:6px;flex-wrap:wrap}
.sheets button{border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:700;font-size:13px;padding:8px 14px;border-radius:9px;cursor:pointer}
.sheets button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.mnav{display:flex;gap:6px;align-items:center}
.mnav button{border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:800;padding:8px 12px;border-radius:9px;cursor:pointer}
.mnav b{min-width:120px;text-align:center}
.pdf{border:0;background:var(--gold);color:#1B2117;font-weight:800;font-size:14px;padding:10px 16px;border-radius:10px;cursor:pointer}
.msg{font-size:12px;color:var(--muted);margin:-4px 0 10px}

.paperwrap{overflow-x:auto;border-radius:6px;padding-bottom:6px}
.paper{width:1080px;min-height:763px;background:var(--paper);color:var(--paper-ink);font-family:var(--form);padding:22px 26px;box-shadow:0 2px 10px rgba(0,0,0,.12);display:flex;flex-direction:column}
.paper h3{margin:0 0 6px;text-align:center;font-size:21px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:12px}
.paper h3{position:relative;min-height:46px}
.paper h3 .logo{position:absolute;left:0;top:-4px;height:52px;width:auto}
.paper .meta{display:flex;justify-content:space-between;font-weight:700;font-size:14px;border-top:1px solid var(--paper-line);border-bottom:1px solid var(--paper-line);padding:6px 4px}
.paper .meta i{font-style:normal;font-weight:500;margin-left:8px}
.paper table{border-collapse:collapse;width:100%;flex:1;table-layout:fixed;font-size:10.5px}
.paper td,.paper th{border:1px solid var(--paper-line);text-align:center;padding:0;height:auto}
.paper th{font-weight:700;font-size:10px;height:26px}
.paper .lab{text-align:center;font-weight:700;font-size:10.5px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper .q{font-weight:700;font-size:10px;white-space:nowrap}
.paper td.c{cursor:pointer;font-weight:700;font-size:9.5px;color:#245A2E}
.paper td.c:hover{background:#F1F1EA}
.paper td.c.dot::after{content:"✓";display:block;font-family:"Gothic A1",system-ui,sans-serif;font-size:15px;font-weight:800;line-height:1;color:#245A2E}
.paper td.c.dot.hot::after{color:#B0351E}
.paper td.c.chk::after{content:"✓";display:block;font-family:"Gothic A1",system-ui,sans-serif;font-size:13px;font-weight:800;line-height:1;color:#245A2E}
.paper td.wkend{background:#FAFAF7}
.paper td.future{background:#F7F7F7;cursor:default}
.paper td.rmk{font-size:8px;color:#555;text-align:center}
.paper .foot{font-size:9px;color:#777;text-align:right;margin-top:4px}

.dialog{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px}
.dialog .card{background:var(--surface);color:var(--fg);border-radius:14px;padding:18px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px}
.dialog h4{margin:0;font-size:17px}
.dialog .list{display:flex;flex-direction:column;gap:6px}
.dialog .it{display:flex;gap:6px}
.dialog input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:600 15px var(--body);padding:8px 10px}
.dialog .x{border:1px solid var(--line);background:transparent;color:var(--warn);border-radius:8px;padding:0 10px;font-weight:800;cursor:pointer}
.dialog .act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dialog .act button,.dialog .add{border:1px solid var(--line);background:var(--bg);color:var(--fg);font-weight:700;padding:9px 14px;border-radius:9px;cursor:pointer}
.dialog .act .pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.dialog .hint{font-size:12px;color:var(--muted);margin:0}

@media (max-width:640px){
  .datenav .d{min-width:0;font-size:15px}
  .chips button{height:44px;font-size:14px}
  .top .wrap{gap:8px}
}
#printarea{display:none}
.cap{position:fixed;left:-20000px;top:0;width:1123px}
.cap .paper{width:1123px;height:794px;min-height:0;box-shadow:none;padding:22px 28px}
@page{size:A4 landscape;margin:7mm}
@media print{
  body{background:#fff}
  body::before,header.top,main,#dlg{display:none!important}
  #printarea{display:block}
  #printarea .paper{width:100%;min-height:0;height:194mm;box-shadow:none;padding:4mm 5mm;break-after:page;page-break-after:always}
  #printarea .paper:last-child{break-after:auto;page-break-after:auto}
  #printarea td.c{cursor:default}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top gut">
  <div class="wrap">
    <div class="brand"><small>MOHAE · HACCP</small>위생 기록</div>
    <div class="datenav">
      <button type="button" id="prev" aria-label="전날">‹</button>
      <div class="d" id="dlabel"></div>
      <button type="button" id="next" aria-label="다음날">›</button>
      <button type="button" class="today" id="gotoday">오늘</button>
    </div>
    <div class="who" id="who"></div>
  </div>
</header>

<main class="gut">
  <div class="wrap">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-today" aria-selected="true">오늘 체크</button>
      <button type="button" role="tab" id="tab-month" aria-selected="false">월별 기록표</button>
      <button type="button" role="tab" id="tab-units" aria-selected="false">설정 · 백업</button>
    </div>
    <div id="sampleBanner"></div>
    <div id="view"></div>
  </div>
</main>
<div id="dlg"></div>
<div id="printarea"></div>

<script>
/* ---------- form definitions (same as the printed MOHAE_위생 sheets) ---------- */
const ZONES=[
 {id:"wc",ko:"화장실",fr:"Toilettes",items:[
  ["Sols","바닥","J"],["Murs","벽","J"],["Poignées","손잡이","J"],["Interrupteurs","스위치","J"],["Robinetterie","수도꼭지","J"],
  ["Lave-mains","세면대","J"],["Toilettes","변기","J"],["Miroirs","거울","J"],["Poubelles","쓰레기통","J"],
  ["Papier toilette","휴지","J"],["Essuie main","핸드타월","J"],["Savon","비누","J"],["Fournitures","비품","J"]]},
 {id:"salle",ko:"홀",fr:"Salle",items:[
  ["Tables","테이블","S"],["Chaises","의자","S"],["Sols","바닥","J"],["Interrupteurs","스위치","J"],["Poignées","손잡이","J"],
  ["Poubelles","쓰레기통","J"],["Tapis","매트","W"],["Etagère","선반","W"],["Miroirs","거울","W"],["Fenêtres","창문","W"],
  ["Privé","창고","W"],["Murs et portes","벽·문","W"]]},
 {id:"cuisine",ko:"주방",fr:"Cuisine",items:[
  ["Sols – Plinthes","바닥·걸레받이","S"],["Grilles – Siphons","배수구","S"],["Poignées de portes","문손잡이","S"],["Interrupteurs","스위치","S"],
  ["Robinetterie","수도꼭지","S"],["Ustensiles – Planches","도구·도마","S"],["Couteaux","칼","S"],["Friteuses","튀김기","S"],
  ["Feux vifs – Fourneaux","화구·레인지","J"],["Fours micro-ondes","전자레인지","J"],["Trancheuse","슬라이서","J"],["Plans de travail","작업대","J"],
  ["Passe plat/Monte-charge","패스·리프트","J"],["Poubelles","쓰레기통","J"],["Filtres de hottes","후드 필터","W"],
  ["Réfrigérateur/Congélateur","냉장고·냉동고","W"],["Tiroirs et étagères","서랍·선반","W"],["Murs et portes","벽·문","W"]]},
];
const FREQ={S:["Après service","서비스 후"],J:["1 X Jour","하루 1번"],W:["1 X Semaine","주 1번"]};
const RANGE={pos:[8,7,6,5,4,3,2,1,0],neg:[-22,-23,-24,-25,-26,-27,-28,-29,-30]};
const LOC={salle:["홀","Salle"],cuisine:["주방","Cuisine"]};
const TYPE={pos:["냉장","Frigo"],neg:["냉동","Congélateur"]};
const DEFAULT_UNITS=[["fs1","pos","salle",1],["fs2","pos","salle",2],["cs1","neg","salle",1],["fc1","pos","cuisine",1],["fc2","pos","cuisine",2],["cc1","neg","cuisine",1]]
  .map(([id,type,loc,n])=>({id,type,loc,name:`${TYPE[type][1]} ${LOC[loc][1]} ${n}`}));

const MOIS=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const WD=["일","월","화","수","목","금","토"];

/* ---------- state (kept in this device's browser) ---------- */
const KEY="mohae-hygiene-v1";
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
function initState(){
  if(S&&S.data&&S.v>=2){if(!S.suppliers)S.suppliers=["Madon","Ace Food","Metro","JFC France","Kedy Pack"];return}
  const keep=S&&S.data&&!S.sample, app=!!window.Android;
  S={v:2,exported:{},suppliers:S?.suppliers||["Madon","Ace Food","Metro","JFC France","Kedy Pack"],people:S?.people||["K","L"],who:S?.who||"K",units:DEFAULT_UNITS.map(u=>({...u})),data:keep?S.data:{},sample:!keep&&!app};
  if(!keep&&!app)seedSample();save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let view="today", cur=new Date(); cur.setHours(12,0,0,0);
let mCur=new Date(cur), sheet="unit:fs1";

const pad=n=>String(n).padStart(2,"0");
const mk=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
function M(key){if(!S.data[key])S.data[key]={c:{},t:{},r:{}};const m=S.data[key];m.rec=m.rec||[];m.oil=m.oil||[];return m}
const hm=()=>{const n=new Date();return pad(n.getHours())+":"+pad(n.getMinutes())};
const tempOk=(u,r)=>!r||LIMIT[u.type](r.v)||(r.a&&r.a.length>0);
function isFuture(d){const t=new Date();t.setHours(23,59,59,0);return d>t}

/* checklist helpers */
function getC(d,z,i){return M(mk(d)).c[z]?.[i]?.[d.getDate()]||null}
function setC(d,z,i,val){const m=M(mk(d));m.c[z]=m.c[z]||{};m.c[z][i]=m.c[z][i]||{};
  if(val)m.c[z][i][d.getDate()]=val;else delete m.c[z][i][d.getDate()];save()}
function weekDone(d,z,i){ // Monday-based week, returns [date, initials] of a check this week (other day)
  const dow=(d.getDay()+6)%7, start=new Date(d);start.setDate(d.getDate()-dow);
  for(let k=0;k<7;k++){const x=new Date(start);x.setDate(start.getDate()+k);
    if(x.toDateString()===d.toDateString())continue;const v=getC(x,z,i);if(v)return [x,v]}
  return null;
}
function getT(d,u){return M(mk(d)).t[u]?.[d.getDate()]||null}
function setT(d,u,v){const m=M(mk(d));m.t[u]=m.t[u]||{};
  if(v===null)delete m.t[u][d.getDate()];else m.t[u][d.getDate()]={v,i:S.who,h:hm()};save()}
function setTA(d,u,patch){const r=getT(d,u);if(!r)return;Object.assign(r,patch);save()}
function getR(d,k){return M(mk(d)).r[k]?.[d.getDate()]||""}
function setR(d,k,txt){const m=M(mk(d));m.r[k]=m.r[k]||{};if(txt)m.r[k][d.getDate()]=txt;else delete m.r[k][d.getDate()];save()}

/* sample data for days before today in the current month */
function seedSample(){
  const t=new Date();t.setHours(12,0,0,0);
  for(let day=1;day<t.getDate();day++){
    const d=new Date(t.getFullYear(),t.getMonth(),day,12);if(d.getDay()===0)continue;
    const ini=day%3===0?"L":"K";
    S.units.forEach(u=>{const m=M(mk(d));m.t[u.id]=m.t[u.id]||{};
      m.t[u.id][day]={v:u.type==="pos"?(day%5===0?4:3):(day%4===0?-24:-25),i:ini}});
    ZONES.forEach(z=>z.items.forEach(([,,f],i)=>{
      if(f==="W"&&d.getDay()!==1)return;
      if(day%9===0&&i===2)return;
      setCRaw(d,z.id,i,ini)}));
    const m=M(mk(d));

/* PDF made inside the page: each sheet → image → A4 landscape page */
async function buildPdf(m){
  const cap=document.createElement("div");cap.className="cap";document.body.appendChild(cap);
  S.units.forEach(u=>cap.appendChild(paperTemp(u,m)));ZONES.forEach(z=>cap.appendChild(paperZone(z,m)));
  cap.appendChild(paperRec(m));cap.appendChild(paperOil(m));
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4",compress:true});
    const pages=[...cap.children];
    for(let k=0;k<pages.length;k++){
      const c=await window.html2canvas(pages[k],{scale:2,backgroundColor:"#ffffff",logging:false});
      if(k>0)pdf.addPage("a4","landscape");
      pdf.addImage(c.toDataURL("image/jpeg",0.9),"JPEG",0,0,297,210,undefined,"FAST");
    }
    pdf.setProperties({title:`MOHAE HACCP ${mk(m)}`,author:"MOHAE"});
    return pdf.output("datauristring").split(",")[1];
  }finally{cap.remove()}
}
window.buildPdf=buildPdf;
window.onPdfResult=ok=>{const e=$("pdfmsg");if(e)e.textContent=ok?"✓ PDF를 저장했어요.":"저장하지 않았어요. 다시 눌러서 위치를 골라주세요."};
function daysIn(m){return new Date(m.getFullYear(),m.getMonth()+1,0).getDate()}
function dayHead(){let h="";for(let i=1;i<=31;i++)h+=`<th>${i}</th>`;return h}
function paperHead(title,right,m){
  return `<h3><img class="logo" src="${LOGO}" alt="MOHAE"><span>${title}</span></h3>
   <div class="meta"><span>MOIS &amp; ANNÉE :<i>${MOIS[m.getMonth()]} ${m.getFullYear()}</i></span><span>${right}</span></div>`}
function paperTemp(u,m){
  const p=document.createElement("div");p.className="paper";
  const pos=u.type==="pos",n=daysIn(m);
  let h=paperHead(pos?"ENCEINTES FROIDES POSITIVES":"ENCEINTES FROIDES NÉGATIVES",`NOM DE L'ENCEINTE FROIDE :<i>${esc(u.name)}</i>`,m);
  h+=`<table><colgroup><col style="width:70px"></colgroup><thead><tr><th></th>${dayHead()}</tr></thead><tbody>`;
  RANGE[u.type].forEach(val=>{h+=`<tr><td class="lab">${val}℃</td>`;
    for(let day=1;day<=31;day++){
      if(day>n){h+=`<td class="future"></td>`;continue}
      const d=new Date(m.getFullYear(),m.getMonth(),day,12),r=getT(d,u.id),fut=isFuture(d);
      const cls=["c"];if(fut)cls.push("future");if(r&&r.v===val){cls.push("dot");if(!LIMIT[u.type](val))cls.push("hot")}
      h+=`<td class="${cls.join(" ")}" data-day="${day}" data-v="${val}"></td>`}
    h+=`</tr>`});
  h+=`<tr><td class="lab">INITIALES</td>`;
  for(let day=1;day<=31;day++){const d=new Date(m.getFullYear(),m.getMonth(),day,12);const r=day<=n?getT(d,u.id):null;h+=`<td class="q">${r?esc(r.i):""}</td>`}
  h+=`</tr><tr><td class="lab">ACTION</td>`;
  const acts=[];
  for(let day=1;day<=31;day++){const d=new Date(m.getFullYear(),m.getMonth(),day,12);const r=day<=n?getT(d,u.id):null;
    const out=r&&!LIMIT[u.type](r.v);if(out)acts.push([day,r]);h+=`<td class="rmk">${out?(r.a&&r.a.length?"✓":"!"):""}</td>`}
  h+=`</tr></tbody></table><p class="sub">ACTIONS CORRECTIVES</p>`;
  if(!acts.length)h+=`<div class="empty">Aucune non-conformité ce mois-ci.</div>`;
  else{h+=`<table class="list"><colgroup><col style="width:60px"><col style="width:60px"><col style="width:70px"><col><col style="width:70px"></colgroup><thead><tr><th>Date</th><th>Heure</th><th>T°</th><th>Action corrective</th><th>Initiales</th></tr></thead><tbody>`;
    acts.forEach(([day,r])=>{const txt=(r.a||[]).map(k=>ACTIONS.find(x=>x[0]===k)?.[2]).filter(Boolean).join(" ; ")+(r.n?" — "+r.n:"");
      h+=`<tr><td>${pad(day)}/${pad(m.getMonth()+1)}</td><td>${r.h||""}</td><td>${r.v}℃</td><td class="l">${esc(txt||"(à compléter)")}</td><td>${esc(r.ai||r.i)}</td></tr>`});
    h+=`</tbody></table>`}
  h+=`<div class="foot">MOHAE · 2 rue Richer 75009 Paris · ✓ = action corrective enregistrée · ! = à compléter</div>`;
  p.innerHTML=h;
  p.querySelectorAll("td.c:not(.future)").forEach(td=>td.onclick=()=>{
    const d=new Date(m.getFullYear(),m.getMonth(),+td.dataset.day,12),val=+td.dataset.v,r=getT(d,u.id);
    setT(d,u.id,r&&r.v===val?null:val);render()});
  return p}
function paperRec(m){
  const p=document.createElement("div");p.className="paper";
  let h=paperHead("CONTRÔLE À RÉCEPTION DES MARCHANDISES","",m);
  const rows=M(mk(m)).rec.slice().sort((a,b)=>a.day-b.day||(a.time>b.time?1:-1));
  h+=`<table class="list"><colgroup><col style="width:62px"><col style="width:56px"><col style="width:130px"><col style="width:80px"><col style="width:64px"><col style="width:76px"><col style="width:64px"><col style="width:110px"><col><col style="width:64px"></colgroup>
   <thead><tr><th>Date</th><th>Heure</th><th>Fournisseur</th><th>Type</th><th>T°</th><th>Emballage</th><th>DLC</th><th>Décision</th><th>Remarques</th><th>Initiales</th></tr></thead><tbody>`;
  rows.forEach(r=>{h+=`<tr><td>${pad(r.day)}/${pad(m.getMonth()+1)}</td><td>${r.time}</td><td>${esc(r.sup)}</td><td>${RTYPE[r.type][1]}</td><td>${r.t===null||r.t===undefined?"—":r.t+"℃"}</td>
    <td>${r.pack?"Conforme":"Non conf."}</td><td>${r.dlc?"OK":"Non conf."}</td><td>${RES[r.res][1]}</td><td class="l">${esc(r.note)}</td><td>${esc(r.i)}</td></tr>`});
  for(let k=rows.length;k<18;k++)h+=`<tr>${"<td></td>".repeat(10)}</tr>`;
  h+=`</tbody></table><div class="foot">MOHAE · 2 rue Richer 75009 Paris · Frais ≤ 4℃ · Surgelé ≤ -18℃</div>`;
  p.innerHTML=h;return p}
function paperOil(m){
  const p=document.createElement("div");p.className="paper";
  let h=paperHead("SUIVI DES HUILES DE FRITURE","FRITEUSE",m);
  const rows=M(mk(m)).oil.slice().sort((a,b)=>a.day-b.day||(a.time>b.time?1:-1));
  h+=`<table class="list"><colgroup><col style="width:90px"><col style="width:80px"><col><col style="width:90px"></colgroup>
   <thead><tr><th>Date</th><th>Heure</th><th>Opération</th><th>Initiales</th></tr></thead><tbody>`;
  rows.forEach(r=>{h+=`<tr><td>${pad(r.day)}/${pad(m.getMonth()+1)}</td><td>${r.time}</td><td class="l">Changement complet de l'huile${r.note?" — "+esc(r.note):""}</td><td>${esc(r.i)}</td></tr>`});
  for(let k=rows.length;k<18;k++)h+=`<tr>${"<td></td>".repeat(4)}</tr>`;
  h+=`</tbody></table><div class="foot">MOHAE · 2 rue Richer 75009 Paris</div>`;
  p.innerHTML=h;return p}
function paperZone(z,m){
  const p=document.createElement("div");p.className="paper";const n=daysIn(m);
  let h=paperHead("ENREGISTREMENT DU PLAN DE NETTOYAGE &amp; DE DÉSINFECTION",`ZONE :<i>${z.fr}</i>`,m);
  h+=`<table><colgroup><col style="width:150px"><col style="width:84px"></colgroup><thead><tr><th>QUOI</th><th>QUAND</th>${dayHead()}</tr></thead><tbody>`;
  z.items.forEach(([fr,,f],i)=>{h+=`<tr><td class="lab">${esc(fr)}</td><td class="q">${FREQ[f][0]}</td>`;
    for(let day=1;day<=31;day++){
      if(day>n){h+=`<td class="future"></td>`;continue}
      const d=new Date(m.getFullYear(),m.getMonth(),day,12),v=getC(d,z.id,i),fut=isFuture(d);
      h+=`<td class="c${fut?" future":""}${v?" chk":""}" data-day="${day}" data-i="${i}" title="${v?esc(v):""}"></td>`}
    h+=`</tr>`});
  h+=`<tr><td class="lab" colspan="2">INITIALES DU CONTRÔLEUR</td>`;
  for(let day=1;day<=31;day++){const d=new Date(m.getFullYear(),m.getMonth(),day,12);
    const set=new Set();if(day<=n)z.items.forEach((_,i)=>{const v=getC(d,z.id,i);if(v)set.add(v)});
    h+=`<td class="q">${esc([...set].join("/"))}</td>`}
  h+=`</tr><tr><td class="lab" colspan="2">REMARQUES DU CONTRÔLEUR</td>`;
  for(let day=1;day<=31;day++){const d=new Date(m.getFullYear(),m.getMonth(),day,12);const r=day<=n?getR(d,"z:"+z.id):"";h+=`<td class="rmk" title="${esc(r)}">${r?"✎":""}</td>`}
  h+=`</tr></tbody></table><div class="foot">MOHAE · 2 rue Richer 75009 Paris · ✎ = remarque enregistrée</div>`;
  p.innerHTML=h;
  p.querySelectorAll("td.c:not(.future)").forEach(td=>td.onclick=()=>{
    const d=new Date(m.getFullYear(),m.getMonth(),+td.dataset.day,12),i=+td.dataset.i;
    setC(d,z.id,i,getC(d,z.id,i)?null:S.who);render()});
  return p}

/* ---------- units settings ---------- */
function renderUnits(){
  const v=$("view");v.innerHTML="";
  const bl=block("b-units","냉장·냉동 설정","Enceintes froides","");
  const list=document.createElement("div");list.className="rows";
  S.units.forEach((u,ix)=>{const r=document.createElement("div");r.className="tcard";
    r.innerHTML=`<div class="tt"><b>${esc(koName(u))}</b><span>${u.type==="pos"?"0 ~ 8℃":"-22 ~ -30℃"}</span></div>
      <div style="display:flex;gap:6px"><input id="un-${u.id}" value="${esc(u.name)}" aria-label="이름" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:600 15px var(--body);padding:8px 10px">
      <button type="button" class="x" style="border:1px solid var(--line);background:transparent;color:var(--warn);border-radius:8px;padding:0 12px;font-weight:800;cursor:pointer">삭제</button></div>`;
    const inp=r.querySelector("input");inp.onchange=()=>{const t=inp.value.trim();if(t){u.name=t;save()}};
    const del=r.querySelector(".x");let sure=false;
    del.onclick=()=>{if(S.units.length<=1)return;if(!sure){sure=true;del.textContent="정말 삭제";del.style.background="var(--warn)";del.style.color="#fff";return}
      S.units.splice(ix,1);save();render()};
    list.appendChild(r)});
  bl.appendChild(list);
  const add=document.createElement("div");add.style.cssText="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap";
  add.innerHTML=Object.keys(LOC).flatMap(l=>Object.keys(TYPE).map(t=>`<button type="button" class="all" data-l="${l}" data-t="${t}">+ ${LOC[l][0]} ${TYPE[t][0]}</button>`)).join("");
  bl.appendChild(add);
  const note=document.createElement("p");note.className="msg";note.style.marginTop="12px";
  note.textContent="이름은 기록표 'NOM DE L'ENCEINTE FROIDE' 칸에 그대로 들어가요. 삭제해도 이미 쌓인 기록은 남아 있어요.";bl.appendChild(note);
  v.appendChild(bl);
  const addU=(t,l)=>{const same=S.units.filter(u=>u.type===t&&u.loc===l);const n=same.length+1;
    const u={id:t[0]+l[0]+Date.now().toString(36),type:t,loc:l,name:`${TYPE[t][1]} ${LOC[l][1]} ${n}`};
    const last=S.units.map(x=>x.loc).lastIndexOf(l);S.units.splice(last<0?S.units.length:last+1,0,u);save();render()};
  add.querySelectorAll("button").forEach(b=>b.onclick=()=>addU(b.dataset.t,b.dataset.l));
  v.appendChild(backupBlock());
}
let restoreAsk=false;
function backupBlock(){
  const bl=block("b-backup","백업","Sauvegarde","");
  const app=!!window.Android;
  const w=document.createElement("div");w.className="oilbig";
  w.innerHTML=`<button type="button" class="save" id="bkSave">백업 파일 저장</button>
    ${restoreAsk?`<span class="since">지금 기록이 백업 파일 내용으로 <b style="font-family:var(--body);font-size:14px;font-weight:800">전부 바뀌어요.</b></span><button type="button" class="all" id="bkYes">불러오기</button><button type="button" class="all" id="bkNo">취소</button>`
      :`<button type="button" class="all" id="bkOpen">백업 불러오기</button>`}`;
  bl.appendChild(w);
  const p=document.createElement("p");p.className="msg";p.id="bkmsg";p.style.marginTop="12px";
  p.textContent=app?"저장할 때 위치를 Google Drive의 모해 폴더로 고르면 드라이브에 바로 올라가요. 한 달에 한 번, PDF 저장할 때 같이 해두세요."
    :"이 미리보기에서는 백업이 안 돼요. 앱에서는 이 버튼으로 Google Drive에 저장하고 불러올 수 있어요.";
  bl.appendChild(p);
  const msg=t=>{const e=$("bkmsg");if(e)e.textContent=t};
  w.querySelector("#bkSave").onclick=()=>{if(!app)return;
    const n=new Date();const name=`MOHAE_위생_백업_${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}.json`;
    window.Android.saveBackup(JSON.stringify({app:"mohae-hygiene",saved:n.toISOString(),state:S}),name)};
  if(restoreAsk){w.querySelector("#bkYes").onclick=()=>{restoreAsk=false;if(app)window.Android.openBackup();render()};w.querySelector("#bkNo").onclick=()=>{restoreAsk=false;render()}}
  else w.querySelector("#bkOpen").onclick=()=>{if(!app)return;restoreAsk=true;render()};
  return bl}
window.onBackupResult=ok=>{const e=$("bkmsg");if(e)e.textContent=ok?"✓ 백업 파일을 저장했어요.":"저장하지 않았어요. 다시 눌러서 위치를 골라주세요."};
window.restoreBackup=text=>{
  try{const o=JSON.parse(text);if(o.app!=="mohae-hygiene"||!o.state||!o.state.data)throw 0;
    S=o.state;save();view="today";render();
    const v=$("view"),b=document.createElement("div");b.className="banner";b.textContent="✓ 백업을 불러왔어요 ("+String(o.saved||"").slice(0,10)+" 저장본)";v.prepend(b);
  }catch(e){view="units";render();const m=$("bkmsg");if(m)m.textContent="이 파일은 모해 위생 백업 파일이 아니에요."}};

/* ---------- people dialog ---------- */
function editPeople(){
  const d=$("dlg");let list=[...S.people];
  const draw=()=>{d.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pt"><div class="card">
    <h4 id="pt">체크하는 사람 (이니셜)</h4><p class="hint">기록표 INITIALES 칸에 들어가는 글자예요. 2~3글자 영문이 좋아요.</p>
    <div class="list">${list.map((p,i)=>`<div class="it"><input id="pp-${i}" maxlength="4" value="${esc(p)}" aria-label="이니셜 ${i+1}"><button type="button" class="x" data-i="${i}" aria-label="삭제">✕</button></div>`).join("")}</div>
    <button type="button" class="add" id="padd">+ 사람 추가</button>
    <div class="act"><button type="button" id="pcancel">취소</button><button type="button" class="pri" id="psave">저장</button></div></div></div>`;
    d.querySelectorAll(".it input").forEach((inp,i)=>inp.oninput=()=>list[i]=inp.value.toUpperCase());
    d.querySelectorAll(".x").forEach(b=>b.onclick=()=>{list.splice(+b.dataset.i,1);draw()});
    $("padd").onclick=()=>{list.push("");draw();d.querySelector(".it:last-child input")?.focus()};
    $("pcancel").onclick=()=>d.innerHTML="";
    $("psave").onclick=()=>{const clean=[...new Set(list.map(s=>s.trim().toUpperCase()).filter(Boolean))];if(!clean.length)return;
      S.people=clean;if(!clean.includes(S.who))S.who=clean[0];save();d.innerHTML="";render()};
  };draw();
}

function render(){
  renderTop();renderBanner();
  ["today","month","units"].forEach(v=>$("tab-"+v).setAttribute("aria-selected",view===v));
  if(view==="today")renderToday();else if(view==="month")renderMonth();else renderUnits();
}
initState();
render();
</script>
